# Production-like stack. Chạy full hệ thống ở 1 máy (company server).
# Trước khi up, tạo .env ở root monorepo theo .env.example.
#
#   docker compose -f infra/docker-compose.prod.yml --env-file .env.local up -d --build
#
# Reverse proxy + TLS tự làm bằng Caddy (bên ngoài stack này) hoặc tier hosting.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-locallife}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../apps/web/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports: ["6333:6333"]
    volumes:
      - qdrantdata:/qdrant/storage

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    env_file: [../.env.local]
    environment:
      # KB content lives at <volume>/knowledge/* — the kbdata volume is a
      # sparse-checkout of the monorepo where only the knowledge subdir is
      # materialised. Web only needs the KB content, so point straight at
      # the nested path. Ingest sync still operates on the volume root
      # because it needs the .git for fetch + reset.
      KNOWLEDGE_DIR: /app/knowledge/knowledge
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-locallife}
      INGEST_API_URL: http://ingest:8001
      INGEST_API_TOKEN: ${INGEST_API_TOKEN:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    ports: ["3000:3000"]
    volumes:
      # Bind mount knowledge để chatbot đọc bản đã sync từ git (tier 2).
      # :ro để cố ý chặn ghi local: admin save phải đi qua git (tier 1)
      # → ingest /sync/knowledge fast-forward mount này.
      - kbdata:/app/knowledge:ro

  ingest:
    build:
      context: ..
      dockerfile: apps/ingest/Dockerfile
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
    env_file: [../.env.local]
    environment:
      REDIS_URL: redis://redis:6379
      RAW_DIR: /data/raw
      LEGAL_DIR: /data/legal
      KNOWLEDGE_DIR: /data/knowledge
      KNOWLEDGE_REPO_OWNER: ${KNOWLEDGE_REPO_OWNER:-huytdvn}
      KNOWLEDGE_REPO_NAME: ${KNOWLEDGE_REPO_NAME:-locallife-asia}
      KNOWLEDGE_REPO_BRANCH: ${KNOWLEDGE_REPO_BRANCH:-main}
      INGEST_API_TOKEN: ${INGEST_API_TOKEN:-}
    ports: ["8001:8001"]
    volumes:
      - rawdata:/data/raw
      - legaldata:/data/legal
      # KB mount RW: ingest chạy git fetch + reset trong /data/knowledge.
      # Chia sẻ volume `kbdata` với web (web mount :ro) để 1 nguồn tier 2.
      - kbdata:/data/knowledge

  worker:
    build:
      context: ..
      dockerfile: apps/ingest/Dockerfile
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
    env_file: [../.env.local]
    environment:
      REDIS_URL: redis://redis:6379
      RAW_DIR: /data/raw
      LEGAL_DIR: /data/legal
    command: ["python", "-m", "app.worker"]
    volumes:
      - rawdata:/data/raw
      - legaldata:/data/legal

volumes:
  pgdata:
  qdrantdata:
  rawdata:
  legaldata:
  # Tier 2 mount: ingest ghi (git pull), web đọc (:ro). Khởi tạo lần đầu
  # bằng `git clone` từ ingest qua scripts/sync-knowledge.sh.
  kbdata:
