name: CI

on:
  # Direct pushes to main come from two places:
  #   1. PR merges — these always touch app code, run full CI.
  #   2. Admin UI saves (commitUpdateDirect) — message starts with
  #      "Edit via admin UI: ..." and only ever touches knowledge/*.md.
  #      No code change → no point running typecheck / build / eval.
  # Filter out (2) by ignoring knowledge-only pushes. Eval drift from KB
  # content is caught instead by the weekly schedule below.
  push:
    branches: [main]
    paths-ignore:
      - 'knowledge/**'
  pull_request:
    branches: [main]
  # Weekly safety net: even with knowledge/** ignored on push, run the
  # gold eval so KB drift surfaces eventually instead of silently rotting
  # until someone touches code.
  schedule:
    - cron: '0 1 * * 1' # Mon 01:00 UTC = Mon 08:00 ICT
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter web typecheck
      - name: Lint
        run: pnpm --filter web lint || true
      - name: Gold eval (retrieval + RBAC)
        env:
          RERANK_OFF: "1"
        run: pnpm --filter web eval
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm --filter web build

  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: apps/ingest
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile check
        working-directory: apps/ingest
        run: python -m compileall app
      - name: Ruff
        working-directory: apps/ingest
        run: ruff check app
      - name: Pytest
        working-directory: apps/ingest
        run: pytest -q || echo "tests empty — ok Phase 2"

  python-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sync to R2 plan mode
        run: python3 scripts/sync-to-r2.py
      - name: Review bot dry-run
        run: python3 scripts/review-bot.py
